# CV en enriquezaporta.es
# El tráfico llega desde cloudflared (localhost:80); Cloudflare pone el HTTPS.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name enriquezaporta.es www.enriquezaporta.es;

    root /var/www/cv/public;
    index index.html;
    charset utf-8;
    server_tokens off;

    # www.enriquezaporta.es -> enriquezaporta.es
    if ($host = www.enriquezaporta.es) {
        return 301 https://enriquezaporta.es$request_uri;
    }

    # Cabeceras de seguridad (solo recursos propios, nada de terceros)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;

    # Nunca servir archivos ocultos (.git, etc.). Va antes que el resto de
    # expresiones regulares porque nginx usa la primera que coincide.
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # CSS y JS cambian con cada push: caché corta
    location ~* \.(css|js)$ {
        expires 1h;
    }

    # Fuentes e imágenes casi nunca cambian
    location ~* \.(woff2|webp|png|svg)$ {
        expires 30d;
    }
}
